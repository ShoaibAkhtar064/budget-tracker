<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker | Statistics</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>Budget Tracker</h1>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="transactions.html">Statistics</a></li>
      </ul>
    </nav>

    <main>
      <!-- Financial Summary -->
      <section class="dashboard">
        <div class="card">
          <h3>Balance</h3>
          <p id="balance">$0.00</p>
        </div>

        <div class="card">
          <h3>Income</h3>
          <p id="income">$0.00</p>
        </div>

        <div class="card">
          <h3>Expenses</h3>
          <p id="expenses">$0.00</p>
        </div>
      </section>

      <!-- Charts -->
      <section class="charts">
        <div class="chart-card">
          <h2>Expense by Category</h2>
          <canvas id="expenseChart"></canvas>
        </div>

        <div class="chart-card">
          <h2>Income vs Expense</h2>
          <canvas id="incomeExpenseChart"></canvas>
        </div>
      </section>

      <section class="currency-section">
        <h2>Live Currency Rates</h2>

        <label for="currency"> Select Currency </label>

        <select id="currency">
          <option value="PKR">PKR</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
        </select>

        <p id="exchange-rate">Loading...</p>
      </section>

      <section class="filter-section">
        <h2>Filter Transactions</h2>

        <label for="category-filter"> Category </label>

        <select id="category-filter">
          <option value="all">All Categories</option>
        </select>

        <label for="type-filter"> Type </label>

        <select id="type-filter">
          <option value="all">All Types</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <label for="date-filter"> Date </label>

        <input type="date" id="date-filter" />

        <button type="button" id="clear-filters">Clear Filters</button>
      </section>

      <section class="transaction-table">
        <h2>Transactions</h2>
        <table>
          <thead>
            <tr>
              <th>Description</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Type</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="transaction-list"></tbody>
        </table>
      </section>
      
    </main>

    <footer>
      <p>© 2026 Budget Tracker</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
